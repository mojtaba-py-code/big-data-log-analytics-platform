[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "big-data-log-analytics"
version = "1.0.0"
description = "Production-grade platform for ingesting, parsing, validating, analyzing and serving very large volumes of application, server, network and security logs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mojtaba Karimi" }]
keywords = ["logs", "analytics", "etl", "observability", "duckdb", "parquet", "fastapi"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "PyYAML>=6.0",
    "python-dateutil>=2.9",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52",
    "duckdb>=1.0",
    "pytz>=2024.1",  # duckdb needs it to return timezone-aware timestamps
    "pyarrow>=16.0",
    "polars>=1.0",
    "redis>=5.0",
    "SQLAlchemy>=2.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
mysql = ["PyMySQL>=1.1"]
api = ["httpx>=0.27"]
kafka = ["confluent-kafka>=2.5"]
celery = ["celery>=5.4"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "fakeredis>=2.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "types-PyYAML",
]

[project.scripts]
loganalytics = "app.cli.main:run"

[project.urls]
Homepage = "https://github.com/mojtaba-py-code/big-data-log-analytics-platform"
Documentation = "https://github.com/mojtaba-py-code/big-data-log-analytics-platform/tree/main/docs"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["py.typed", "dashboard/static/*"]

# --------------------------------------------------------------------------- #
# Tooling
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "C4",       # comprehensions
    "UP",       # pyupgrade
    "S",        # bandit-ish security rules
    "T20",      # no print in library code
    "SIM",      # simplify
    "RET",      # return consistency
    "PTH",      # pathlib
    "ARG",      # unused arguments
    "N",        # pep8-naming
]
ignore = [
    "S101",   # asserts are fine in tests (see per-file ignores too)
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "RET504", # allow named result before return for readability
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "ARG", "T20", "N806"]
"scripts/*" = ["T20", "S311"]
"benchmarks/*" = ["T20", "S311"]
"app/cli/*" = ["T20"]
"app/synthetic/*" = ["S311"]  # PRNG is used for fake data, never for security

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
# 3.12, not 3.11: numpy's bundled stubs use PEP 695 `type` statements, which a
# 3.11 target rejects outright and which aborts the whole run before any of
# this project's code is checked.  Ruff still enforces the 3.11 floor
# (`target-version = "py311"`), so 3.12-only syntax cannot slip in unnoticed.
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = []
exclude = "(^build/|^dist/)"

[[tool.mypy.overrides]]
module = ["tests.*", "benchmarks.*", "scripts.*"]
disallow_untyped_defs = false
strict = false

# pyarrow annotates `pyarrow.parquet` from 25.0 onwards; the declared floor is
# 16.0.  The two modules that call it therefore need `# type: ignore
# [no-untyped-call]` on an older pyarrow and must not have it on a newer one,
# which no single source file can satisfy.  Keeping the comments and not
# warning about them here is the one form that type-checks on both.
[[tool.mypy.overrides]]
module = ["app.storage.parquet_store", "app.workers.jobs"]
warn_unused_ignores = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "unit: fast isolated tests",
    "integration: tests that touch storage/api/cache",
    "performance: throughput and memory benchmarks (slow)",
    "security: security regression tests",
    "slow: excluded from the default fast run",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
branch = true
# celery_app only runs under a real broker; everything else is covered.
omit = ["app/workers/celery_app.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]

[tool.bandit]
exclude_dirs = ["tests", "build", "dist", ".venv"]
# B608 (SQL built by string formatting) fires on every analytics query.  All of
# them interpolate only two things: a source expression built from the
# platform's own partition layout, and column names checked against
# QUERYABLE_COLUMNS.  Every *value* is a bound parameter.  The invariant is
# enforced by tests/security/test_security.py::TestSearchInjection, which is a
# stronger guarantee than a per-line waiver, so the rule is skipped globally
# rather than silenced 22 times.  See docs/SECURITY.md.
skips = ["B608"]
