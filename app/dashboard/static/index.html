<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log Analytics</title>
<!-- Every rule and every line of script lives in a same-origin file; nothing on
     this page is inline.  That is what lets the API send a CSP with no
     'unsafe-inline' in any directive.  {{base}} is the mount path, substituted
     when the page is served. -->
<link rel="stylesheet" href="{{base}}/dashboard.css">
<script src="{{base}}/dashboard.js" defer></script>
</head>
<body>
<header>
  <h1>Log Analytics</h1>
  <select id="range" title="Time window">
    <option value="1">Last hour</option>
    <option value="6">Last 6 hours</option>
    <option value="24" selected>Last 24 hours</option>
    <option value="168">Last 7 days</option>
    <option value="720">Last 30 days</option>
  </select>
  <select id="window" title="Bucket size">
    <option value="1m">1 minute</option>
    <option value="5m" selected>5 minutes</option>
    <option value="15m">15 minutes</option>
    <option value="1h">1 hour</option>
    <option value="6h">6 hours</option>
    <option value="1d">1 day</option>
  </select>
  <select id="service" title="Service"><option value="">All services</option></select>
  <input id="apikey" type="password" placeholder="API key" size="18" autocomplete="off">
  <div class="spacer"></div>
  <label class="toggle">
    <input type="checkbox" id="auto"> auto-refresh
  </label>
  <button id="refresh" class="primary">Refresh</button>
</header>
<p id="banner"></p>

<main>
  <section class="tiles" id="tiles"></section>

  <section class="grid">
    <div class="card"><h2>Requests over time</h2><div id="chart-requests"></div></div>
    <div class="card"><h2>Errors over time</h2><div id="chart-errors"></div></div>
    <div class="card"><h2>P95 latency over time</h2><div id="chart-latency"></div></div>
    <div class="card"><h2>Status code distribution</h2><div id="chart-status"></div></div>
    <div class="card"><h2>Top endpoints</h2><div id="table-endpoints"></div></div>
    <div class="card"><h2>Top client addresses</h2><div id="table-ips"></div></div>
    <div class="card"><h2>Errors by service</h2><div id="table-errsvc"></div></div>
    <div class="card"><h2>Service health</h2><div id="table-services"></div></div>
    <div class="card full"><h2>Anomalies</h2><div id="table-anomalies"></div></div>
    <div class="card full"><h2>Security findings</h2><div id="table-security"></div></div>
  </section>
</main>
<footer>Big Data Log Analytics Platform &middot; <span id="generated"></span></footer>
</body>
</html>
